# 静的配信と /api のリバースプロキシ。
# フロントエンドと API を同一オリジンに見せることで CORS を不要にする (ADR-001)。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/ プレフィックスを保ったまま api コンテナへ転送する。
    # proxy_pass の URL に末尾パスを付けないことで、書き換えずに前送りされる。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # メトリクス応答は大きくなりうる (1 ファイルで数 MB)。
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA フォールバック。/graph/xxx を直接開いても index.html を返す。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
